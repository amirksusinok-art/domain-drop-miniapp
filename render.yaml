# Preview tier. Before a public launch, upgrade both resources to paid plans.
services:
  - type: web
    name: domain-drop-miniapp
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: DEV_AUTH
        value: "false"
      - key: APP_URL
        value: https://domain-drop-miniapp.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: domain-drop-db
          property: connectionString
      - key: WEBHOOK_SECRET
        generateValue: true
# BOT_TOKEN, BOT_USERNAME, ADMIN_TELEGRAM_IDS and SUPPORT_USERNAME are added
# as server-only secrets/settings after the initial deploy, via Dashboard.
databases:
  - name: domain-drop-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
